name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Lint chart
        run: helm lint charts/elk

      - name: Pod restarts on config change
        run: |
          a=$(helm template t charts/elk | grep 'checksum/config:')
          b=$(helm template t charts/elk --set logstash.pipeline=changed | grep 'checksum/config:')
          test -n "$a" && test "$a" != "$b"

      - name: Unit tests
        run: ruby tests/source_host_test.rb

      - name: End-to-end (Logstash + Elasticsearch)
        run: tests/e2e.sh
