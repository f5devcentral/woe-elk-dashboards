{{- if .Values.kibana.importDashboards }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elk.fullname" . }}-kibana-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "elk.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: kibana-setup
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - -c
        - |
          set -e
          KIBANA_URL="http://{{ include "elk.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.kibana }}"

          echo "Waiting for Kibana to be ready..."
          until curl -sf "${KIBANA_URL}/api/status" >/dev/null 2>&1; do
            echo "  Kibana not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "Kibana is ready."

          echo "Creating waf-logs-* index pattern..."
          curl -sf -X POST "${KIBANA_URL}/api/saved_objects/index-pattern/waf-logs" \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            -d '{"attributes":{"title":"waf-logs-*","timeFieldName":"@timestamp"}}' \
            || echo "  (index pattern may already exist)"

          echo "Setting waf-logs as default index pattern..."
          curl -sf -X POST "${KIBANA_URL}/api/kibana/settings" \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            -d '{"changes":{"defaultIndex":"waf-logs"}}' \
            || echo "  (failed to set default, non-fatal)"

          {{- if .Files.Get "files/waf-dashboards.ndjson" }}
          echo "Importing WAF dashboards..."
          curl -sf -X POST "${KIBANA_URL}/api/saved_objects/_import?overwrite=true" \
            -H "kbn-xsrf: true" \
            --form file=@/dashboards/waf-dashboards.ndjson \
            || echo "  (dashboard import failed, non-fatal)"
          {{- end }}

          echo "Kibana setup complete."
        {{- if .Files.Get "files/waf-dashboards.ndjson" }}
        volumeMounts:
        - name: dashboards
          mountPath: /dashboards
      volumes:
      - name: dashboards
        configMap:
          name: {{ include "elk.fullname" . }}-dashboards
        {{- end }}
{{- end }}
