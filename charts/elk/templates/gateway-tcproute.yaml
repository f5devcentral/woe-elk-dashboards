{{- $syslog := .Values.gateway.syslog | default dict }}
{{- if and .Values.gateway.enabled $syslog.enabled }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "elk.fullname" . }}-syslog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    sectionName: {{ $syslog.listenerName | default "waf-syslog" }}
  rules:
  - backendRefs:
    - name: {{ include "elk.fullname" . }}
      port: {{ .Values.service.syslog }}
{{- end }}
