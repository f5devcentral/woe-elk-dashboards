{{- $syslog := .Values.gateway.syslog | default dict }}
{{- if and .Values.gateway.enabled $syslog.enabled }}
{{- /* Older Gateway API CRDs serve TCPRoute only as v1alpha2. */}}
{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/TCPRoute" }}
apiVersion: gateway.networking.k8s.io/v1
{{- else }}
apiVersion: gateway.networking.k8s.io/v1alpha2
{{- end }}
kind: TCPRoute
metadata:
  name: {{ include "elk.fullname" . }}-syslog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    sectionName: {{ $syslog.listenerName | default "waf-syslog" }}
  rules:
  - backendRefs:
    - name: {{ include "elk.fullname" . }}
      port: {{ .Values.service.syslog }}
{{- end }}
