{{- if .Values.gateway.enabled }}
{{/*
Gateway listener manifest, mounted into the patch Job. The Job applies this
with server-side apply. Because Gateway `spec.listeners` is a list-type=map
keyed by `name`, SSA merges just this one listener into the existing gateway
without clobbering the other listeners (kibana, syslog, ...) and is fully
idempotent across re-runs (post-install AND post-upgrade).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elk.fullname" . }}-gw-listener
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  listener.yaml: |
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
    spec:
      listeners:
      - name: {{ .Values.gateway.listenerName }}
        protocol: HTTP
        port: {{ .Values.gateway.listenerPort }}
        allowedRoutes:
          namespaces:
            from: Same
      {{- if .Values.gateway.syslog.enabled }}
      - name: {{ .Values.gateway.syslog.listenerName }}
        protocol: TCP
        port: {{ .Values.gateway.syslog.listenerPort }}
        allowedRoutes:
          kinds:
          - kind: TCPRoute
          namespaces:
            from: Same
      {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elk.fullname" . }}-gw-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "elk.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "elk.fullname" . }}-gw-patch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: patch
        image: {{ .Values.gateway.kubectl.image }}
        # Shell-free: apply the listener via server-side apply. The default
        # image (registry.k8s.io/kubectl) is distroless and has no shell.
        {{- with .Values.gateway.kubectl.command }}
        command:
          {{- toYaml . | nindent 8 }}
        {{- else }}
        command: ["/bin/kubectl"]
        {{- end }}
        args:
        - apply
        - --server-side
        - --force-conflicts
        - --field-manager=elk-gw-patch
        - -n
        - {{ .Release.Namespace }}
        - -f
        - /manifests/listener.yaml
        volumeMounts:
        - name: gw-listener
          mountPath: /manifests
          readOnly: true
      volumes:
      - name: gw-listener
        configMap:
          name: {{ include "elk.fullname" . }}-gw-listener
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elk.fullname" . }}-gw-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "elk.fullname" . }}-gw-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "elk.fullname" . }}-gw-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
- kind: ServiceAccount
  name: {{ include "elk.fullname" . }}-gw-patch
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "elk.fullname" . }}-gw-patch
{{- end }}
